name: Iris checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
        include:
          - os: macos-latest
            python: '3.12'
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        name: Prepare silent CI audio
        run: |
          sudo apt-get update && sudo apt-get install -y libportaudio2
          echo "ALSA_CONFIG_PATH=$GITHUB_WORKSPACE/tests/fixtures/alsa-null.conf" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.7.19
      - run: uv sync --locked --extra dev --python '${{ matrix.python }}'
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync mypy
      - run: uv run --no-sync python scripts/check.py --coverage --artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python }}
          path: |
            .cache/checks/coverage.json
            .cache/checks/coverage.md
          include-hidden-files: true
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.7.19
      - run: uv sync --locked --extra dev --python '3.12'
      - run: uv run --no-sync python -m playwright install --with-deps chromium
      - run: uv run --no-sync python -m pytest tests/web --browser -q

  javascript:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
  profiles:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        profile: [base, server, memory, vad, face]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: runner.os == 'Linux'
        name: Prepare silent CI audio
        run: |
          sudo apt-get update && sudo apt-get install -y libportaudio2
          echo "ALSA_CONFIG_PATH=$GITHUB_WORKSPACE/tests/fixtures/alsa-null.conf" >> "$GITHUB_ENV"
      - run: python -m pip install build 'setuptools>=77'
      - run: python -m build --wheel
      - run: python scripts/check_clean_install.py ${{ matrix.profile }}
